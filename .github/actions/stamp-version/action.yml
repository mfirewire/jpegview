name: Action - Stamp version from tag (or dev stamp)
description: >
  Stamp JPEGVIEW_VERSION (and the .rc version strings) from the tag on tag
  builds, so About shows the release tag and no manual bump commit is needed.
  On non-tag builds, append the dev stamp instead, so a dev build stays
  distinguishable from the release.

runs:
  using: composite
  steps:
    - name: Stamp release version from tag
      if: ${{ github.ref_type == 'tag' }}
      # Tag builds are formal releases: the version is the tag itself, taken
      # as-is (with the leading 'v'), and no dev marker is appended.
      # Pure PowerShell regex, no sed: passing a sed expression through
      # PowerShell's native-command quoting mangled it (the sed form failed
      # on the runner with "unterminated 's' command").
      # Fails loudly if the stamp does not land (O-03 lesson).
      shell: powershell
      run: |
        $TAG_VER = "${{ github.ref_name }}"
        $content = [System.IO.File]::ReadAllText("src/JPEGView/resource.h")
        $content = [regex]::Replace($content, '(#define JPEGVIEW_VERSION ")[^"]*\\0"', ('$1' + $TAG_VER + '\0"'))
        [System.IO.File]::WriteAllText("src/JPEGView/resource.h", $content, (New-Object System.Text.UTF8Encoding($false)))
        $rc = [System.IO.File]::ReadAllText("src/JPEGView/JPEGView.rc")
        $rc = [regex]::Replace($rc, '(VALUE "FileVersion", ")[^"]*(")', ('$1' + $TAG_VER + '$2'))
        $rc = [regex]::Replace($rc, '(VALUE "ProductVersion", ")[^"]*(")', ('$1' + $TAG_VER + '$2'))
        [System.IO.File]::WriteAllText("src/JPEGView/JPEGView.rc", $rc, (New-Object System.Text.UTF8Encoding($false)))
        if (-not (Select-String -Path src/JPEGView/resource.h -Pattern ([regex]::Escape($TAG_VER)) -Quiet)) { throw "tag version stamp was not applied to src/JPEGView/resource.h" }
        if (-not (Select-String -Path src/JPEGView/JPEGView.rc -Pattern ([regex]::Escape($TAG_VER)) -Quiet)) { throw "tag version stamp was not applied to src/JPEGView/JPEGView.rc" }
        Write-Output "Stamped release version $TAG_VER"

    - name: Stamp dev version (non-tag build)
      if: ${{ github.ref_type != 'tag' }}
      # Non-tag builds fall back to the previous release version in source
      # plus the short SHA, so they stay distinguishable from the release
      # (same dev marker as the build-solution action).
      shell: powershell
      run: |
        $GIT_SHORT_HASH=$(git.exe rev-parse --short "${{ github.sha }}")
        $APPEND_VER_STR = " (~GHdevtest ${{ github.repository_owner }}/$GIT_SHORT_HASH)"
        $content = [System.IO.File]::ReadAllText("src/JPEGView/resource.h")
        $content = [regex]::Replace($content, '(#define JPEGVIEW_VERSION ")([A-Za-z0-9., -]+)(\\0")', ('$1$2' + $APPEND_VER_STR + '$3'))
        $content = [regex]::Replace($content, '(#define JPEGVIEW_TITLE ")(JPEGView)(")', ('$1$2' + $APPEND_VER_STR + '$3'))
        [System.IO.File]::WriteAllText("src/JPEGView/resource.h", $content, (New-Object System.Text.UTF8Encoding($false)))
        # O-10: the dev stamp also updates the .rc version strings, so a dev
        # build's Explorer FileVersion / About matches the resource.h dev
        # version. Same restricted character class as resource.h, so a
        # re-run cannot double-append (the stamped string contains '(' and
        # '/', which the class excludes). Tag step above is untouched.
        $rc = [System.IO.File]::ReadAllText("src/JPEGView/JPEGView.rc")
        $rc = [regex]::Replace($rc, '(VALUE "FileVersion", ")([A-Za-z0-9., -]+)(")', ('$1$2' + $APPEND_VER_STR + '$3'))
        $rc = [regex]::Replace($rc, '(VALUE "ProductVersion", ")([A-Za-z0-9., -]+)(")', ('$1$2' + $APPEND_VER_STR + '$3'))
        [System.IO.File]::WriteAllText("src/JPEGView/JPEGView.rc", $rc, (New-Object System.Text.UTF8Encoding($false)))
        # R-27: verify the full append string, not just the "GHdevtest"
        # substring, so a stale stamp from another owner/SHA cannot pass.
        # [regex]::Escape: $APPEND_VER_STR contains regex metacharacters
        # '(' and ')' (and '/'), and Select-String -Pattern is a regex.
        # Same Escape form as the tag-step check above.
        if (-not (Select-String -Path src/JPEGView/resource.h -Pattern ([regex]::Escape($APPEND_VER_STR)) -Quiet)) { throw "dev version stamp was not applied to src/JPEGView/resource.h" }
        if (-not (Select-String -Path src/JPEGView/JPEGView.rc -Pattern ([regex]::Escape($APPEND_VER_STR)) -Quiet)) { throw "dev version stamp was not applied to src/JPEGView/JPEGView.rc" }
        Write-Output "Stamped dev version $APPEND_VER_STR"
