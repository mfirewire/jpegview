name: Action - Build JPEGView Solution
description: Action to build the solution and apply any customizations if requested

inputs:
  patch-version:
    description: Apply patch to the version labels to reflect the owner and sha of commit.
    required: false
    type: boolean
    default: true

  platform-arch:
    description: Architecture for building
    required: true
    type: string

  build-config:
    description: Debug/Release for building
    required: true
    type: string


runs:
  using: composite
  steps:
    - name: Setup Git Short SHA env var + Print GitHub commit/trigger info
      shell: powershell
      # the hacky way to get the sha1 short hash into a GH variable instead of powershell variable
      # on Windows, unlike the help says, it's $env:GITHUB_ENV or else nothing works
      run: |
        # NOTE: this variable is used by other steps, like uploading artifacts
        echo "short_sha=$(git rev-parse --short "${{ github.sha }}")" >> $env:GITHUB_ENV
        # print out other info related to the repo to make it easier to see what triggered the workflow
        echo "Repository: ${{ github.repository }}"
        echo "Branch: ${{ github.ref_name }}"
        echo "Commit: ${{ github.sha }}"
        echo "GH Trigger: ${{ github.event_name }}"

    - name: Replace resource vars
      if: ${{ inputs.patch-version }}
      # O-03: the stamp used to fail silently (continue-on-error + a
      # Select-String that only checked the line exists, not the stamp),
      # so a broken regex shipped unstamped dev builds. The step now
      # fails loudly if the stamp is not applied; fix the regex instead
      # of re-adding continue-on-error.
      shell: powershell
      # Replace the version information for auto-GH builds so it's clear to me and others that this was not a formal release:
      # * replaces in JPEGView main window and About dialog
      # * replaces in Setup's initial startup screen
      run: |
        # Pure PowerShell regex, no sed: passing a sed expression through
        # PowerShell's native-command quoting mangled it (the sed form failed
        # on the runner, and its '/' in 'owner/sha' also broke s///).
        # The title pattern is "JPEGView", matching the file (the old
        # "JPEGVIEW" never matched).
        $GIT_SHORT_HASH=$(git.exe rev-parse --short "${{ github.sha }}")
        $APPEND_VER_STR = " (~GHdevtest ${{ github.repository_owner }}/$GIT_SHORT_HASH)"
        $content = [System.IO.File]::ReadAllText("src/JPEGView/resource.h")
        $content = [regex]::Replace($content, '(#define JPEGVIEW_VERSION ")([A-Za-z0-9., -]+)(\\0")', ('$1$2' + $APPEND_VER_STR + '$3'))
        $content = [regex]::Replace($content, '(#define JPEGVIEW_TITLE ")(JPEGView)(")', ('$1$2' + $APPEND_VER_STR + '$3'))
        [System.IO.File]::WriteAllText("src/JPEGView/resource.h", $content, (New-Object System.Text.UTF8Encoding($false)))
        $wxs = [System.IO.File]::ReadAllText("src/JPEGView.Setup/Product.wxs")
        # A4-4: the stamp regex is anchored on the closing quote, so a
        # re-run is a no-op (the stamped text puts ' (~GHdevtest ...'
        # between ')' and '"', breaking the match) instead of appending twice.
        $wxs = [regex]::Replace($wxs, '(<Product.*ApplicationName\))(")', ('$1' + $APPEND_VER_STR + '$2'))
        [System.IO.File]::WriteAllText("src/JPEGView.Setup/Product.wxs", $wxs, (New-Object System.Text.UTF8Encoding($false)))
        # O-10: the dev stamp also updates the .rc version strings, so a dev
        # build's Explorer FileVersion / About matches the resource.h dev
        # version. Same restricted character class as resource.h, so a
        # re-run cannot double-append (the stamped string contains '(' and
        # '/', which the class excludes).
        $rc = [System.IO.File]::ReadAllText("src/JPEGView/JPEGView.rc")
        $rc = [regex]::Replace($rc, '(VALUE "FileVersion", ")([A-Za-z0-9., -]+)(")', ('$1$2' + $APPEND_VER_STR + '$3'))
        $rc = [regex]::Replace($rc, '(VALUE "ProductVersion", ")([A-Za-z0-9., -]+)(")', ('$1$2' + $APPEND_VER_STR + '$3'))
        [System.IO.File]::WriteAllText("src/JPEGView/JPEGView.rc", $rc, (New-Object System.Text.UTF8Encoding($false)))
        # O-03: verify the stamp actually landed (the old Select-String
        # only checked the lines exist, so a non-matching sed passed
        # silently). Fail the step if any file is unstamped.
        # R-27: verify the full append string, not just the "GHdevtest"
        # substring, so a stale stamp from another owner/SHA cannot pass.
        # [regex]::Escape: $APPEND_VER_STR contains regex metacharacters
        # '(' and ')' (and '/'), and Select-String -Pattern is a regex.
        # Same Escape form as the tag-step check in stamp-version.
        if (-not (Select-String -Path src/JPEGView/resource.h -Pattern ([regex]::Escape($APPEND_VER_STR)) -Quiet)) { throw "dev version stamp was not applied to src/JPEGView/resource.h" }
        if (-not (Select-String -Path src/JPEGView.Setup/Product.wxs -Pattern ([regex]::Escape($APPEND_VER_STR)) -Quiet)) { throw "dev version stamp was not applied to src/JPEGView.Setup/Product.wxs" }
        if (-not (Select-String -Path src/JPEGView/JPEGView.rc -Pattern ([regex]::Escape($APPEND_VER_STR)) -Quiet)) { throw "dev version stamp was not applied to src/JPEGView/JPEGView.rc" }


    # R-06: regenerate the ThorVG import library with MSVC LIB.EXE from the
    # checked-in .def, before msbuild links JPEGView.exe. The committed
    # lib/lib64/libthorvg-1.lib is dlltool-generated (no SAFESEH info), so
    # a Win32 /SAFESEH link fails (LNK2026/LNK1281) against it. The action
    # overwrites the in-checkout .lib and uploads it as an artifact so it
    # can be committed back (CI never commits by itself).
    - uses: ./.github/actions/regen-thorvg-lib
      with:
        platform-arch: ${{ inputs.platform-arch }}
        build-config: ${{ inputs.build-config }}

    - name: Build Solution
      shell: cmd
      run: |
        echo (Optional) INCLUDE: %INCLUDE%
        msbuild.exe /property:Platform=${{ inputs.platform-arch }} /property:configuration="${{ inputs.build-config }}" /p:AdditionalIncludeDirectories="%INCLUDE%" "/flp1:LogFile=build.err;ErrorsOnly" "/flp2:LogFile=build.log;Normal" src\JPEGView.sln

    # R-06 verification: the Win32 exe must carry a Safe Exception Handler
    # table (dumpbin /loadconfig). No-op on x64.
    - uses: ./.github/actions/verify-safeseh
      with:
        platform-arch: ${{ inputs.platform-arch }}
        build-config: ${{ inputs.build-config }}

    # 把 msbuild 的错误行转成 GitHub annotation，便于在 API 侧定位（job log API 返回 403）
    - name: Surface build errors as annotations
      if: failure()
      shell: powershell
      run: |
        if (Test-Path build.err) {
          $lines = @(Get-Content build.err | Where-Object { $_.Trim() -ne "" })
          Write-Output "===== msbuild error lines: $($lines.Count) ====="
          $n = 0
          foreach ($l in $lines) {
            $n++
            if ($n -gt 12) { break }
            Write-Output "::error::$l"
          }
          Write-Output "===== first 60 error lines (full) ====="
          $lines | Select-Object -First 60 | ForEach-Object { Write-Output $_ }
        } else {
          Write-Output "::error::build.err not found - msbuild did not run or wrote no log"
        }

    - name: Upload build log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: buildlog-${{ inputs.platform-arch }}-${{ inputs.build-config }}
        path: |
          build.log
          build.err
        if-no-files-found: ignore
