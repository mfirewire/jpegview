name: YMCK polarity guard

# Three consecutive CMYK "fixes" (F-M23, ec8032f, 9746da5) each re-derived the
# plane polarity from the previous patch instead of from a fact, and the last
# one turned every real Photoshop file black. The polarity cannot be settled by
# reading the code, so it is pinned in src/JPEGView/YmckDecode.h and guarded
# from two directions:
#
#   * endpoint assertions - they encode what the picture must look like
#     (no ink = white), not what the code happens to compute;
#   * a static gate - the inversion may only happen in that one header.
#
# Runs on Linux so it proves the assertions need no Windows toolchain.
on:
  push:
  pull_request:

jobs:
  guard:
    name: Endpoint assertions and polarity gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (no submodules needed)
        uses: actions/checkout@v5
        with:
          submodules: false

      - name: Static polarity gate
        run: python3 .github/scripts/check_ymck_polarity.py

      - name: Endpoint assertions
        run: |
          g++ -std=c++17 -Wall -Wextra -O2 -I src/JPEGView tests/ymck_decode_test.cpp -o /tmp/ymck_test
          /tmp/ymck_test

      # A guard that cannot fail is decoration. Build the same test with the
      # polarity flipped; the compile itself must stop inside YmckDecode.h.
      - name: Prove the assertions can fail
        run: |
          set +e
          g++ -std=c++17 -DYMCK_PLANE_IS_INVERTED=0 -I src/JPEGView tests/ymck_decode_test.cpp -o /tmp/ymck_mutant 2>/tmp/mutant.log
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "::error::flipping the plane polarity still compiles - the endpoint assertions guard nothing"
            exit 1
          fi
          grep -q "static assertion failed: A1" /tmp/mutant.log || {
            echo "::error::the mutant was rejected, but not by assertion A1 - check the test harness"
            sed -n '1,20p' /tmp/mutant.log
            exit 1
          }
          echo "mutant rejected by A1 as expected"

  cmyk-pixel-test:
    name: CMYK end-to-end pixel test (B-CMYK1)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (no submodules needed)
        uses: actions/checkout@v5
        with:
          submodules: false

      - name: Install OpenJPEG and Pillow
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenjp2-7-dev libopenjp2-tools
          # 11.3.0 is the oldest Pillow with a Python 3.14 wheel; 10.2.0
          # has none and its sdist fails to build on the runner.
          python3 -m pip install --break-system-packages Pillow==11.3.0

      - name: CMYK pixel test
        run: |
          g++ -std=c++17 -Wall -Wextra -O2 -I src/JPEGView tests/cmyk_pixel_test.cpp \
              -o /tmp/cmyk_pixel_test $(pkg-config --cflags --libs libopenjp2)
          /tmp/cmyk_pixel_test

      - name: CMYK reference check
        run: python3 tests/cmyk_reference_check.py

  loader-regression-test:
    name: Loader regression tests (B-TEST1)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (no submodules needed)
        uses: actions/checkout@v5
        with:
          submodules: false

      - name: PNM scaling test
        run: |
          g++ -std=c++17 -Wall -Wextra -O2 -I src/JPEGView tests/loader_pnm_test.cpp -o /tmp/loader_pnm_test
          /tmp/loader_pnm_test

      - name: JPEG Exif APP1 test
        run: |
          g++ -std=c++17 -Wall -Wextra -O2 -I src/JPEGView tests/loader_jpeg_exif_test.cpp -o /tmp/loader_jpeg_exif_test
          /tmp/loader_jpeg_exif_test

      - name: PNM scale contract gate
        run: python3 tests/check_pnm_scale.py

      - name: TGA 15-bit RLE sample check
        run: python3 tests/check_tga_rle_sample.py

      - name: TGA RLE decoder test
        run: |
          g++ -std=c++17 -Wall -Wextra -O2 -I src/JPEGView tests/loader_tga_rle_test.cpp -o /tmp/loader_tga_rle_test
          /tmp/loader_tga_rle_test

      - name: PNG cICP chunk scan test (HDR routing)
        run: |
          g++ -std=c++17 -Wall -Wextra -O2 -I src/JPEGView tests/loader_png_cicp_test.cpp src/JPEGView/HdrToneMap.cpp -o /tmp/loader_png_cicp_test
          /tmp/loader_png_cicp_test

      - name: PNG HDR alpha rule test (e8228df regression)
        run: |
          g++ -std=c++17 -Wall -Wextra -O2 -I src/JPEGView tests/png_hdr_alpha_test.cpp -o /tmp/png_hdr_alpha_test
          /tmp/png_hdr_alpha_test

      - name: TinyEXR multipart header test (CVE-2026-110597)
        run: |
          g++ -std=c++17 -Wall -Wextra -O2 -I src/JPEGView -I src/JPEGView/tinyexr tests/tinyexr_multipart_test.cpp src/JPEGView/tinyexr/miniz.c src/JPEGView/tinyexr/miniz_tdef.c src/JPEGView/tinyexr/miniz_tinfl.c -o /tmp/tinyexr_multipart_test
          /tmp/tinyexr_multipart_test

      # The PoC does not crash a plain build (the over-read garbage
      # fails later), so the ASan run is the guard with teeth: on
      # unpatched code it aborts with a heap-buffer-overflow in
      # ReadAttribute. Verified locally both ways (patched: clean,
      # unpatched: abort).
      - name: TinyEXR multipart test under ASan (CVE-2026-110597 guard)
        run: |
          g++ -std=c++17 -Wall -Wextra -O1 -g -fsanitize=address -I src/JPEGView -I src/JPEGView/tinyexr tests/tinyexr_multipart_test.cpp src/JPEGView/tinyexr/miniz.c src/JPEGView/tinyexr/miniz_tdef.c src/JPEGView/tinyexr/miniz_tinfl.c -o /tmp/tinyexr_multipart_test_asan
          ASAN_OPTIONS=detect_leaks=0 /tmp/tinyexr_multipart_test_asan

      - name: Save-path ICC filter test (N2)
        run: |
          g++ -std=c++17 -Wall -Wextra -O2 -I src/JPEGView tests/save_icc_filter_test.cpp src/JPEGView/SaveIccFilter.cpp -o /tmp/save_icc_filter_test
          /tmp/save_icc_filter_test

  hdr-tonemap-test:
    name: HDR tone-mapping helper test (Option A)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (no submodules needed)
        uses: actions/checkout@v5
        with:
          submodules: false

      - name: HDR tone-mapping unit test
        run: |
          g++ -std=c++17 -Wall -Wextra -O2 -I src/JPEGView tests/hdr_tonemap_test.cpp src/JPEGView/HdrToneMap.cpp -o /tmp/hdr_tonemap_test
          /tmp/hdr_tonemap_test
  gainmap-test:
    name: Gain-map helper test (Option D, Phase 1)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (no submodules needed)
        uses: actions/checkout@v5
        with:
          submodules: false

      - name: Gain-map unit test
        run: |
          g++ -std=c++17 -Wall -Wextra -O2 -I src/JPEGView tests/gainmap_test.cpp src/JPEGView/GainMap.cpp src/JPEGView/HdrToneMap.cpp -o /tmp/gainmap_test
          /tmp/gainmap_test

      - name: HEIF gain-map apply test
        run: |
          g++ -std=c++17 -Wall -Wextra -O2 -I src/JPEGView tests/heif_gainmap_test.cpp src/JPEGView/GainMap.cpp src/JPEGView/HdrToneMap.cpp -o /tmp/heif_gainmap_test
          /tmp/heif_gainmap_test
  avif-gainmap-test:
    name: AVIF gain-map path test (Option D, Phase 4)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (no submodules needed)
        uses: actions/checkout@v5
        with:
          submodules: false

      - name: AVIF gain-map unit test
        run: |
          g++ -std=c++17 -Wall -Wextra -O2 -I src/JPEGView -I src/JPEGView/libavif/include tests/avif_gainmap_test.cpp src/JPEGView/GainMap.cpp src/JPEGView/HdrToneMap.cpp -o /tmp/avif_gainmap_test
          /tmp/avif_gainmap_test
  psd-hdr-test:
    name: PSD HDR decode core test (16/32-bit PSD)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (no submodules needed)
        uses: actions/checkout@v5
        with:
          submodules: false

      # H-02: the test builds ICC profiles on the fly with lcms2
      # (PsdIcc.cpp), so it needs the lcms2 headers and -llcms2.
      # A stock Ubuntu image has only the runtime library
      # (liblcms2.so.2), not the dev package: without this step the
      # link fails with "cannot find -llcms2" (verified on Ubuntu
      # 24.04). The install is the documented fallback the task
      # allows when the run proves it necessary.
      - name: Install lcms2 dev package (H-02 test dependency)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends liblcms2-dev

      - name: PSD HDR unit test
        run: |
          g++ -std=c++17 -Wall -Wextra -O2 -I src/JPEGView -I src/JPEGView/libpng-apng/include tests/psd_hdr_test.cpp src/JPEGView/PsdHdr.cpp src/JPEGView/PsdIcc.cpp src/JPEGView/HdrToneMap.cpp -lz -llcms2 -o /tmp/psd_hdr_test
          /tmp/psd_hdr_test

  jxl-frame-header-test:
    name: JXL frame-header API semantics test (S1)
    # Runs on ubuntu-latest (26.04). The runner image does not install
    # libjxl, so the job installs libjxl-dev (26.04's repo has 0.11.1)
    # and links plain -ljxl. The harness only reads `duration` (offset
    # 0) and `is_last` (offset 12) through a padded buffer, and those
    # fields match between the vendored 0.13 headers and upstream
    # 0.11.1, so linking a different minor version is safe. The local
    # build line in the harness header still uses -l:libjxl.so.0.7
    # (this box has no dev symlink); CI uses -ljxl instead.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (no submodules needed)
        uses: actions/checkout@v5
        with:
          submodules: false

      - name: Install libjxl dev package (link target)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libjxl-dev

      - name: JXL frame-header harness test
        run: |
          g++ -std=c++17 -Wall -Wextra -O2 -DJXL_STATIC_DEFINE -I src/JPEGView/libjxl/include tests/jxl_frame_header_test.cpp -ljxl -o /tmp/jxl_frame_header_test
          /tmp/jxl_frame_header_test
  jxl-gainmap-test:
    name: JXL gain-map (jhgm) extraction test
    # Runs on ubuntu-latest (26.04). The runner image does not install
    # libjxl, so the job installs libjxl-dev (26.04's repo has 0.11.1)
    # and links plain -ljxl. The test decodes the nested gain
    # codestream and the real base with the system decoder; the
    # exercised symbols are ABI-stable across the vendored 0.13 headers
    # and upstream 0.11.1. The box walk, bundle parse and metadata
    # parse are pure C++ in GainMap.h/.cpp (JXLWrapper.cpp is
    # MFC-coupled and does not compile on Linux).
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (no submodules needed)
        uses: actions/checkout@v5
        with:
          submodules: false

      - name: Install libjxl dev package (link target)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libjxl-dev

      - name: JXL gain-map extraction test
        run: |
          g++ -std=c++17 -Wall -Wextra -O2 -DJXL_STATIC_DEFINE -I src/JPEGView -I src/JPEGView/libjxl/include tests/jxl_gainmap_test.cpp src/JPEGView/GainMap.cpp src/JPEGView/HdrToneMap.cpp -ljxl -o /tmp/jxl_gainmap_test
          /tmp/jxl_gainmap_test
  gainmap-rotate-test:
    name: Gain-map free-rotation boundary test (RotateGrayFree P1)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (no submodules needed)
        uses: actions/checkout@v5
        with:
          submodules: false

      - name: Gain-map free-rotation boundary test
        run: |
          g++ -std=c++17 -Wall -Wextra -O2 -I src/JPEGView tests/gainmap_rotate_test.cpp src/JPEGView/GainMap.cpp src/JPEGView/HdrToneMap.cpp -o /tmp/gainmap_rotate_test
          /tmp/gainmap_rotate_test
  gainmap-signed-weight-test:
    name: Gain-map signed-weight unification test (NB-1)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (no submodules needed)
        uses: actions/checkout@v5
        with:
          submodules: false

      - name: Gain-map signed-weight test
        run: |
          g++ -std=c++17 -Wall -Wextra -O2 -I src/JPEGView tests/gainmap_signed_weight_test.cpp src/JPEGView/GainMap.cpp src/JPEGView/HdrToneMap.cpp -o /tmp/gainmap_signed_weight_test
          /tmp/gainmap_signed_weight_test
