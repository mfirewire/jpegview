name: CMake Modern CI (CMake 4.x / VS2026 / C++23)

on:
  workflow_dispatch:
  push:
    branches: [feature/prit36-merge]

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        config: [Release, Debug]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up MSVC Dev Environment
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Configure CMake
      run: |
        cmake -B build -S . -DCMAKE_BUILD_TYPE=${{ matrix.config }}

    - name: Build JPEGView
      shell: pwsh
      run: |
        cmake --build build --config ${{ matrix.config }} --parallel 2>&1 | Tee-Object -FilePath "build_${{ matrix.config }}.log"
        if ($LASTEXITCODE -ne 0) { exit 1 }

    # job log 的 API 是 403，只能靠 annotation 取信息
    - name: Surface build errors as annotations
      if: failure()
      shell: pwsh
      run: |
        $log = "build_${{ matrix.config }}.log"
        if (-not (Test-Path $log)) { Write-Output "::error::$log not found"; exit 0 }
        $lines = @(Get-Content $log)
        $errs = @($lines | Where-Object { $_ -match '(?i)error|fatal|cannot open|undefined|LNK\d|C\d{4}' } | Select-Object -Last 10)
        if ($errs.Count -eq 0) { $errs = @($lines | Select-Object -Last 10) }
        foreach ($e in $errs) { Write-Output "::error::$e" }

    - name: Verify the artifact folder is complete
      if: matrix.config == 'Release'
      shell: pwsh
      run: |
        # KeyMap.txt.default 这种扩展名不是 .txt，之前用 *.txt 通配就把它漏掉了，
        # 结果 zip 里没有键位表，程序启动后所有快捷键静默失效。这里显式把关。
        $need = @('JPEGView.exe', 'KeyMap.txt.default', 'symbols.km', 'JPEGView.ini', 'strings.txt')
        $missing = @($need | Where-Object { -not (Test-Path "build/bin/Release/$_") })
        if ($missing.Count -gt 0) {
          $missing | ForEach-Object { Write-Output "::error::missing from build/bin/Release: $_" }
          exit 1
        }
        Write-Output "artifact folder OK: $($need.Count) required files present"

    - name: Upload Artifacts (Release)
      if: matrix.config == 'Release'
      uses: actions/upload-artifact@v4
      with:
        name: JPEGView-Modern-x64-Release
        path: build/bin/Release/*
