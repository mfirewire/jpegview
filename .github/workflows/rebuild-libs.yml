name: Rebuild third-party libs

# 手动触发。逐个把 extras/third_party/*-src 里的源码编成静态库/DLL 并覆盖
# src/JPEGView/lib*/ 下的预编译产物，成功后自动提交。
#
# 注意：libheif / libavif 已经交给 rebuild-batch3.yml。两个工作流都会改
# src/JPEGView/libheif 和 libavif，如果同时跑会互相覆盖并让后 push 的那个
# 被拒。所以这里去掉 push 触发，只在手动需要单独重建 LibRaw 时使用。

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Build LibRaw
        shell: cmd
        run: |
          call extras\scripts\build-libraw.bat > build_libraw.log 2>&1
          set RC=%ERRORLEVEL%
          type build_libraw.log
          exit /b %RC%

      - name: Surface build failure as annotations
        if: failure()
        shell: powershell
        run: |
          if (Test-Path build_libraw.log) {
            $lines = @(Get-Content build_libraw.log | Where-Object { $_.Trim() -ne "" })
            Write-Output "===== last 25 lines of build log ====="
            $lines | Select-Object -Last 25 | ForEach-Object { Write-Output "::error::$_" }
          } else {
            Write-Output "::error::build_libraw.log not found - the batch file never ran"
          }

      - name: Show resulting binaries
        shell: cmd
        run: |
          dir src\JPEGView\libraw\lib\*.lib src\JPEGView\libraw\bin\*.dll
          dir src\JPEGView\libraw\lib64\*.lib src\JPEGView\libraw\bin64\*.dll

      # libheif 的构建脚本要求 dav1d 源码位于 libheif-1.23.7-src\dav1d，
      # 而仓库里只有旧的子模块路径 extras/third_party/libheif/dav1d。这里现取 dav1d 1.5.4。
      - name: Fetch dav1d source for libheif
        shell: powershell
        run: |
          $dst = "extras/third_party/libheif-1.23.7-src/dav1d"
          if (Test-Path $dst) {
            Write-Output "dav1d 源码已存在，跳过下载"
            exit 0
          }
          Invoke-WebRequest -Uri "https://github.com/videolan/dav1d/archive/refs/tags/1.5.4.zip" -OutFile dav1d.zip
          Expand-Archive dav1d.zip -DestinationPath dav1d-tmp -Force
          Move-Item dav1d-tmp/dav1d-1.5.4 $dst
          Write-Output "dav1d 1.5.4 已就位"

      # dav1d 的汇编需要 nasm。choco 装完后当前 shell 的 PATH 不会刷新，
      # 必须写进 GITHUB_PATH，否则后续 step 里 build 脚本的 "where nasm.exe" 仍然失败。
      - name: Ensure nasm on PATH
        shell: powershell
        run: |
          if (Get-Command nasm.exe -ErrorAction SilentlyContinue) {
            Write-Output "nasm 已在 PATH"
            Get-Command nasm.exe | Select-Object -ExpandProperty Source
            exit 0
          }
          choco install nasm -y --no-progress
          $nasmDir = "C:\Program Files\NASM"
          if (-not (Test-Path $nasmDir)) {
            $found = Get-ChildItem "C:\Program Files*" -Directory -Filter "NASM*" -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($found) { $nasmDir = $found.FullName }
          }
          if (-not (Test-Path "$nasmDir\nasm.exe")) { throw "nasm.exe 安装后仍找不到（$nasmDir）" }
          Write-Output $nasmDir >> $env:GITHUB_PATH
          Write-Output "nasm 安装于 $nasmDir，已写入 GITHUB_PATH"

      # 脚本期望的两个源码位置在仓库里对不上：
      #  - libde265 实际在 extras/third_party/libde265-1.1.3-src，脚本却找 libheif-1.23.7-src\libde265-1.1.3-src
      #  - libavif 是未初始化的空子模块
      # 这里补到位，脚本本身不动。
      - name: Stage missing sources for libheif
        shell: powershell
        run: |
          $deSrc = "extras/third_party/libde265-1.1.3-src"
          $deDst = "extras/third_party/libheif-1.23.7-src/libde265-1.1.3-src"
          if (-not (Test-Path $deDst)) {
            if (-not (Test-Path $deSrc)) { throw "libde265 源码缺失：$deSrc" }
            Copy-Item $deSrc $deDst -Recurse -Force
            Write-Output "libde265 已复制到 $deDst"
          }

          $avif = "extras/third_party/libavif"
          if (-not (Test-Path "$avif/CMakeLists.txt")) {
            Remove-Item $avif -Recurse -Force -ErrorAction SilentlyContinue
            Invoke-WebRequest -Uri "https://github.com/AOMediaCodec/libavif/archive/refs/tags/v1.4.2.zip" -OutFile libavif.zip
            Expand-Archive libavif.zip -DestinationPath libavif-tmp -Force
            Move-Item libavif-tmp/libavif-1.4.2 $avif
            Write-Output "libavif 1.4.2 已就位"
          }

      - name: Build libheif + libavif + libde265
        shell: cmd
        run: |
          call extras\scripts\build-libheif_libavif.bat > build_libheif.log 2>&1
          set RC=%ERRORLEVEL%
          type build_libheif.log
          exit /b %RC%

      - name: Surface libheif build failure as annotations
        if: failure()
        shell: powershell
        run: |
          if (-not (Test-Path build_libheif.log)) {
            Write-Output "::error::build_libheif.log not found - the batch file never ran"
            exit 0
          }
          $lines = @(Get-Content build_libheif.log | Where-Object { $_.Trim() -ne "" })
          # 构建脚本会吞掉 cmake/nmake 的返回码，只保留最后一句话，所以优先抓真正的错误行
          $errs = @($lines | Where-Object { $_ -match '(?i)error|cannot|not found|failed|no such|拒绝|找不到' } | Select-Object -Last 8)
          if ($errs.Count -gt 0) {
            foreach ($e in $errs) { Write-Output "::error::$e" }
          } else {
            Write-Output "::error::没有匹配到 error 关键字的行，输出最后 8 行"
            $lines | Select-Object -Last 8 | ForEach-Object { Write-Output "::error::$_" }
          }

      - name: Upload binaries
        uses: actions/upload-artifact@v7
        with:
          name: rebuilt-libs
          path: |
            src/JPEGView/libraw/**
            src/JPEGView/libheif/**
            src/JPEGView/libavif/**
          if-no-files-found: error

      - name: Commit rebuilt binaries
        shell: bash
        run: |
          git config user.name "mfirewire"
          git config user.email "mfirewire@gmail.com"
          git add src/JPEGView/libraw src/JPEGView/libheif src/JPEGView/libavif
          if git diff --cached --quiet; then
            echo "没有变化，跳过提交"
            exit 0
          fi
          git commit -m "build(deps): LibRaw 0.22.3 / libheif 1.23.7 / libavif rebuilt in CI"
          git push
