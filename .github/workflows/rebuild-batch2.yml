name: Rebuild dav1d + libde265

# 批次 2：两个纯运行时 DLL（JPEGView 不直接链接它们，heif.dll / avif.dll 在运行时加载）
#  - dav1d 1.5.1 -> 1.5.4     （AV1 解码，被 libavif / libheif 使用）
#  - libde265 1.0.16 -> 1.1.3 （HEVC 解码，被 libheif 使用）
# 两个都从子模块源码编译，x64 与 Win32 各一份，产物提交回分支。

on:
  workflow_dispatch:
  push:
    branches:
      - 'feature/*'
      - 'master'
    paths:
      - '.github/workflows/rebuild-batch2.yml'

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: false

      - name: Init the two decoder submodules
        shell: bash
        run: |
          git submodule update --init extras/third_party/libheif/dav1d extras/third_party/libheif/libde265

      - name: Pin dav1d to 1.5.4
        shell: bash
        run: |
          cd extras/third_party/libheif/dav1d
          git fetch --depth 1 origin refs/tags/1.5.4:refs/tags/1.5.4
          git checkout -q 1.5.4
          grep -m1 "version:" meson.build

      - name: Pin libde265 to v1.1.3
        shell: bash
        run: |
          cd extras/third_party/libheif/libde265
          git fetch --depth 1 origin refs/tags/v1.1.3:refs/tags/v1.1.3
          git checkout -q v1.1.3
          # 1.1.x 不再提交生成的 de265-version.h（改成 CMake 从 .in 生成），
          # 所以这里只确认检出的标签对。
          git describe --tags

      - name: Install meson, ninja, nasm
        shell: pwsh
        run: |
          python -m pip install --quiet --upgrade meson ninja
          $nasmDir = "C:\Program Files\NASM"
          if (-not (Test-Path "$nasmDir\nasm.exe")) {
            choco install nasm -y --no-progress
          }
          if (-not (Test-Path "$nasmDir\nasm.exe")) {
            Write-Output "::error::nasm.exe not found after install"
            exit 1
          }
          # GITHUB_PATH 只对后续 step 生效，本 step 里要自己加到当前进程
          $env:PATH = "$nasmDir;$env:PATH"
          Write-Output $nasmDir | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          meson --version
          nasm -v

      - name: Build dav1d (x64 + x86)
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          Write-Output "VS: $vsPath"
          foreach ($arch in @("x64", "x86")) {
            $buildDir = "build-dav1d-$arch"
            cmd /c "`"$vsPath\VC\Auxiliary\Build\vcvarsall.bat`" $arch && meson setup $buildDir extras/third_party/libheif/dav1d --buildtype=release -Ddefault_library=shared -Denable_tools=false -Denable_tests=false -Denable_examples=false && ninja -C $buildDir"
            if ($LASTEXITCODE -ne 0) { Write-Output "::error::dav1d build failed for $arch"; exit 1 }
          }
          Get-ChildItem -Recurse build-dav1d-* -Filter dav1d.dll | ForEach-Object { Write-Output ("  " + $_.FullName + " " + $_.Length) }

      - name: Build libde265 (x64 + Win32)
        shell: pwsh
        run: |
          foreach ($p in @(@{a="x64"; d="build-de265-x64"}, @{a="Win32"; d="build-de265-x86"})) {
            cmake -S extras/third_party/libheif/libde265 -B $p.d -A $p.a -DCMAKE_BUILD_TYPE=Release -DENABLE_SDL=OFF -DENABLE_ENCODER=OFF -DBUILD_SHARED_LIBS=ON
            if ($LASTEXITCODE -ne 0) { Write-Output "::error::libde265 configure failed for $($p.a)"; exit 1 }
            cmake --build $p.d --config Release --parallel
            if ($LASTEXITCODE -ne 0) { Write-Output "::error::libde265 build failed for $($p.a)"; exit 1 }
          }
          Get-ChildItem -Recurse build-de265-* -Filter libde265.dll | ForEach-Object { Write-Output ("  " + $_.FullName + " " + $_.Length) }

      - name: Install the new DLLs
        shell: pwsh
        run: |
          $dav64 = Get-ChildItem -Recurse build-dav1d-x64 -Filter dav1d.dll | Select-Object -First 1
          $dav32 = Get-ChildItem -Recurse build-dav1d-x86 -Filter dav1d.dll | Select-Object -First 1
          $de265_64 = Get-ChildItem -Recurse build-de265-x64 -Filter libde265.dll | Select-Object -First 1
          $de265_32 = Get-ChildItem -Recurse build-de265-x86 -Filter libde265.dll | Select-Object -First 1
          foreach ($f in @($dav64,$dav32,$de265_64,$de265_32)) {
            if (-not $f) { Write-Output "::error::one of the four DLLs was not produced"; exit 1 }
          }
          # dav1d 同时被 libavif 与 libheif 使用，两份目录都要更新
          Copy-Item $dav64.FullName "src/JPEGView/libheif/bin64/dav1d.dll" -Force
          Copy-Item $dav64.FullName "src/JPEGView/libavif/bin64/dav1d.dll" -Force
          Copy-Item $dav32.FullName "src/JPEGView/libheif/bin/dav1d.dll" -Force
          Copy-Item $dav32.FullName "src/JPEGView/libavif/bin/dav1d.dll" -Force
          Copy-Item $de265_64.FullName "src/JPEGView/libheif/bin64/libde265.dll" -Force
          Copy-Item $de265_32.FullName "src/JPEGView/libheif/bin/libde265.dll" -Force
          Write-Output "--- installed ---"
          Get-ChildItem src/JPEGView/libheif/bin64, src/JPEGView/libavif/bin64, src/JPEGView/libheif/bin -Filter *.dll |
            ForEach-Object { Write-Output ("  " + $_.Directory.Parent.Name + "/" + $_.Directory.Name + "/" + $_.Name + "  " + $_.Length) }

      - name: Commit rebuilt DLLs
        shell: bash
        run: |
          git config user.name "mfirewire"
          git config user.email "mfirewire@gmail.com"
          git add -A src/JPEGView/libheif src/JPEGView/libavif extras/third_party/libheif/dav1d extras/third_party/libheif/libde265
          if git diff --cached --quiet; then
            echo "没有变化，跳过提交"
            exit 0
          fi
          git commit -m "build(deps): dav1d 1.5.4 + libde265 1.1.3 rebuilt in CI"
          git push
