name: Reusable - Build/Upload WTL submod
# TODO later test and lint
# TODO test building library dependencies (the prebuilt stuff)



# GH Action Reusable Workflow -- https://docs.github.com/en/actions/using-workflows/reusing-workflows
on:
  workflow_call:
    inputs:
      platform-arch:
        required: true
        type: string
      build-config:
        required: true
        type: string


jobs:
  build:
    # Temporary pin: windows-latest moved to VS2026, which lacks both the v143 ATL headers
    # and stdext::hash_map. Revert to windows-latest once hash_map is migrated to
    # unordered_map, since the windows-2022 image will eventually be retired.
    runs-on: windows-2022

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup msbuild
      id: setup-msbuild
      # https://github.com/marketplace/actions/setup-msbuild
      uses: microsoft/setup-msbuild@v1.1
      with:
        # Use any available VS 2022+ (runner may only have newer VS, not VS 2019)
        vs-version: '[17.0,]'
        msbuild-architecture: ${{ inputs.platform-arch }}

    - name: Set IncludePath env var from setup-msbuild output
      shell: powershell
      run: |
        $includePath = "${{ steps.setup-msbuild.outputs.includePath }}"
        if ($includePath) {
          echo "INCLUDEPATH=$includePath" >> $env:GITHUB_ENV
          echo "IncludePath set to: $includePath"
        } else {
          echo "WARNING: setup-msbuild did not output includePath"
        }

    - name: Locate ATL headers (atlbase.h) and lib (atls.lib) and add to IncludePath/LIB
      shell: powershell
      run: |
        $vsInstallDir = "${{ steps.setup-msbuild.outputs.vsInstallationPath }}"
        if (-not $vsInstallDir) {
          $vsInstallDir = (vswhere -latest -products * -requires Microsoft.Component.MSBuild -property installationPath)
        }
        $buildArch = "${{ inputs.platform-arch }}"
        echo "VS Install Dir: $vsInstallDir | Build Arch: $buildArch"
        # Find atlbase.h
        $incPatterns = @(
          "$vsInstallDir\VC\Tools\MSVC\*\atlmfc\include",
          "$vsInstallDir\VC\atlmfc\include",
          "$vsInstallDir\VC\Auxiliary\VS\include"
        )
        $foundInc = $false
        $atlIncPath = ""
        foreach ($pattern in $incPatterns) {
          $matches = Get-ChildItem -Path $pattern -ErrorAction SilentlyContinue
          foreach ($m in $matches) {
            $atlBase = Join-Path $m.FullName "atlbase.h"
            if (-not $foundInc -and (Test-Path $atlBase)) {
              echo "Found atlbase.h at: $atlBase"
              $atlIncPath = $m.FullName
              $foundInc = $true
              break
            }
          }
          if ($foundInc) { break }
        }
        if ($foundInc) {
          echo "ATLINCLUDE=$atlIncPath" >> $env:GITHUB_ENV
        } else {
          echo "WARNING: atlbase.h not found in common locations"
        }
        # Find atls.lib matching the build architecture (x64/x86), not ARM
        $archMap = @{ "x64" = "x64"; "x86" = "x86"; "Win32" = "x86" }
        $targetArch = $archMap[$buildArch]
        if (-not $targetArch) { $targetArch = "x64" }
        $libPattern = "$vsInstallDir\VC\Tools\MSVC\*\atlmfc\lib\*\atls.lib"
        $libMatch = Get-ChildItem -Path $libPattern -ErrorAction SilentlyContinue |
          Where-Object { $_.Directory.Name -eq $targetArch } |
          Select-Object -First 1
        if ($libMatch) {
          $atlLibPath = Split-Path $libMatch.FullName -Parent
          echo "Found atls.lib ($targetArch) at: $($libMatch.FullName)"
          echo "ATLLIBPATH=$atlLibPath" >> $env:GITHUB_ENV
        } else {
          echo "WARNING: atls.lib for arch '$targetArch' not found"
        }

    - name: Merge IncludePath (setup-msbuild + ATL)
      shell: powershell
      run: |
        $paths = @()
        $setupPath = "${{ steps.setup-msbuild.outputs.includePath }}"
        if ($setupPath) { $paths += $setupPath }
        $atlPath = "${{ env.ATLINCLUDE }}"
        if ($atlPath) { $paths += $atlPath }
        $merged = ($paths -join ';')
        echo "INCLUDEPATH=$merged" >> $env:GITHUB_ENV
        echo "INCLUDE=$merged" >> $env:GITHUB_ENV
        echo "Final IncludePath: $merged"

    - name: Merge LIB env var with ATL lib path
      shell: powershell
      run: |
        $atlLib = "${{ env.ATLLIBPATH }}"
        if ($atlLib) {
          $existingLib = [Environment]::GetEnvironmentVariable("LIB", [EnvironmentVariableTarget]::Process)
          if ($existingLib) {
            echo "LIB=$atlLib;$existingLib" >> $env:GITHUB_ENV
          } else {
            echo "LIB=$atlLib" >> $env:GITHUB_ENV
          }
          echo "Final LIB: $atlLib"
        } else {
          echo "WARNING: No ATL lib path to add to LIB"
        }

    - uses: ./.github/actions/setup-wix

    - uses: ./.github/actions/wtl-submodule

    - name: Build Solution
      shell: cmd
      run: |
        echo (Optional) INCLUDE: %INCLUDE%
        echo (Optional) ATLLIBPATH: %ATLLIBPATH%
        msbuild.exe /property:Platform=${{ inputs.platform-arch }} /property:configuration="${{ inputs.build-config }}" /p:AdditionalIncludeDirectories="%INCLUDE%" /p:AdditionalLibraryDirectories="%ATLLIBPATH%" src\\JPEGView.sln

    - uses: ./.github/actions/upload-some-artifacts
      with:
        platform-arch: ${{ inputs.platform-arch }}
        build-config: ${{ inputs.build-config }}
