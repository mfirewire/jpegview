name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-win32:
    name: Build Win32 Release
    # Temporary pin: windows-latest moved to VS2026, which lacks both the v143 ATL headers
    # and stdext::hash_map. Revert to windows-latest once hash_map is migrated to
    # unordered_map, since the windows-2022 image will eventually be retired.
    runs-on: windows-2022
    outputs:
      short_sha: ${{ env.short_sha }}
    steps:
    - name: Checkout code with submodules
      uses: actions/checkout@v3
      with:
        submodules: recursive
    - name: Setup Git Short SHA
      shell: powershell
      run: echo "short_sha=$(git rev-parse --short "${{ github.sha }}")" >> $env:GITHUB_ENV
    - name: Setup msbuild
      id: setup-msbuild-win32
      uses: microsoft/setup-msbuild@v1.1
      with:
        # Use any available VS 2022+
        vs-version: '[17.0,]'
        msbuild-architecture: Win32
    - name: Set IncludePath env var from setup-msbuild output (Win32)
      shell: powershell
      run: |
        $includePath = "${{ steps.setup-msbuild-win32.outputs.includePath }}"
        if ($includePath) {
          echo "INCLUDEPATH=$includePath" >> $env:GITHUB_ENV
          echo "IncludePath set to: $includePath"
        } else {
          echo "WARNING: setup-msbuild did not output includePath"
        }
    - uses: ./.github/actions/setup-wix
    - uses: ./.github/actions/wtl-submodule
    - name: Build Solution Win32 Release
      shell: cmd
      run: msbuild.exe /property:Platform=Win32 /property:configuration="Release" src\\JPEGView.sln
    - name: Upload Win32 artifact
      uses: actions/upload-artifact@v4
      with:
        name: jpegview-win32-${{ env.short_sha }}
        path: |
          src/JPEGView/bin/x86/Release/*

  build-x64:
    name: Build x64 Release
    # Temporary pin: windows-latest moved to VS2026, which lacks both the v143 ATL headers
    # and stdext::hash_map. Revert to windows-latest once hash_map is migrated to
    # unordered_map, since the windows-2022 image will eventually be retired.
    runs-on: windows-2022
    outputs:
      short_sha: ${{ env.short_sha }}
    steps:
    - name: Checkout code with submodules
      uses: actions/checkout@v3
      with:
        submodules: recursive
    - name: Setup Git Short SHA
      shell: powershell
      run: echo "short_sha=$(git rev-parse --short "${{ github.sha }}")" >> $env:GITHUB_ENV
    - name: Setup msbuild
      id: setup-msbuild-x64
      uses: microsoft/setup-msbuild@v1.1
      with:
        # Use any available VS 2022+
        vs-version: '[17.0,]'
        msbuild-architecture: x64
    - name: Set IncludePath env var from setup-msbuild output (x64)
      shell: powershell
      run: |
        $includePath = "${{ steps.setup-msbuild-x64.outputs.includePath }}"
        if ($includePath) {
          echo "INCLUDEPATH=$includePath" >> $env:GITHUB_ENV
          echo "IncludePath set to: $includePath"
        } else {
          echo "WARNING: setup-msbuild did not output includePath"
        }
    - uses: ./.github/actions/setup-wix
    - uses: ./.github/actions/wtl-submodule
    - name: Build Solution x64 Release
      shell: cmd
      run: msbuild.exe /property:Platform=x64 /property:configuration="Release" src\\JPEGView.sln
    - name: Upload x64 artifact
      uses: actions/upload-artifact@v4
      with:
        name: jpegview-x64-${{ env.short_sha }}
        path: |
          src/JPEGView/bin/x64/Release/*

  release:
    name: Create GitHub Release
    needs: [build-win32, build-x64]
    # Temporary pin: windows-latest moved to VS2026, which lacks both the v143 ATL headers
    # and stdext::hash_map. Revert to windows-latest once hash_map is migrated to
    # unordered_map, since the windows-2022 image will eventually be retired.
    runs-on: windows-2022
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    - name: Setup Git Short SHA
      shell: powershell
      run: echo "short_sha=$(git rev-parse --short "${{ github.sha }}")" >> $env:GITHUB_ENV
    - name: Download Win32 artifact
      uses: actions/download-artifact@v4
      with:
        name: jpegview-win32-${{ env.short_sha }}
        path: release-artifacts/win32
    - name: Download x64 artifact
      uses: actions/download-artifact@v4
      with:
        name: jpegview-x64-${{ env.short_sha }}
        path: release-artifacts/x64
    # WICLoader's .pdb is ~4.7 MB and the .exp/.lib are build by-products; the
    # regular Build workflows strip them, so keep the release zip the same size.
    - name: Remove WICLoader debug files
      shell: bash
      run: |
        rm -f release-artifacts/win32/WICLoader.exp release-artifacts/win32/WICLoader.lib release-artifacts/win32/WICLoader.pdb
        rm -f release-artifacts/x64/WICLoader.exp release-artifacts/x64/WICLoader.lib release-artifacts/x64/WICLoader.pdb
    # Win32 and x64 binaries share the same file names, so they cannot be uploaded
    # flat into one release (the second would overwrite the first and then fail).
    # Zip each architecture under a distinct name instead.
    - name: Package Win32
      shell: pwsh
      run: Compress-Archive -Path release-artifacts/win32/* -DestinationPath release-artifacts/JPEGView-win32.zip
    - name: Package x64
      shell: pwsh
      run: Compress-Archive -Path release-artifacts/x64/* -DestinationPath release-artifacts/JPEGView-x64.zip
    - name: Create Release and upload assets
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ github.ref_name }}
        name: ${{ github.ref_name }} - memory-safety and stability fixes: RAW heap overflow, thread-pool deadlock, worker-thread UAF, OCR multi-select.
        draft: false
        prerelease: false
        files: |
          release-artifacts/JPEGView-win32.zip
          release-artifacts/JPEGView-x64.zip
