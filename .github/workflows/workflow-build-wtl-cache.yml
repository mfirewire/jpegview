name: Reusable - Build/Upload WTL cached
# TODO later test and lint
# TODO test building library dependencies (the prebuilt stuff)



# GH Action Reusable Workflow -- https://docs.github.com/en/actions/using-workflows/reusing-workflows
on:
  workflow_call:
    inputs:
      platform-arch:
        required: true
        type: string
      build-config:
        required: true
        type: string


# NOTE: This workflow may not be used in the future, but kept around for historical
# reasons (might need to use this cache routine in the future for other libs),
# or in case it is preferred to use this if the other breaks
#
# Currently this is used as the process for Debug releases


jobs:
  build:
    # 同 workflow-build-wtl-submodule.yml：固定 windows-2022。
    # windows-latest 已迁移到 windows-2025-vs2026（VS2026 / v145），镜像里没有 VS 17.x，
    # setup-msbuild 会报 "Unable to find MSBuild."。
    runs-on: windows-2022

    steps:
    - uses: actions/checkout@v5

    - name: setup-msbuild
      # https://github.com/marketplace/actions/setup-msbuild
      # v3 不再需要 vs-version，自动取镜像里安装的 VS2022
      uses: microsoft/setup-msbuild@v3
      with:
        msbuild-architecture: ${{ inputs.platform-arch }}

    - uses: ./.github/actions/setup-wix

    # 原先是 ./.github/actions/wtl-cache：从 SourceForge 下载 WTL 到 WTL_Release\Include，
    # 但 JPEGView.vcxproj 的 IncludePath 指向 deps\WTL-sf\Include（子模块路径），两边对不上，
    # 导致 Debug 构建报 C1083: Cannot open include file: 'atlapp.h'。
    # 改用与 Release 相同的子模块方式，保证两条路径一致。
    - uses: ./.github/actions/wtl-submodule

    - uses: ./.github/actions/build-solution
      with:
        platform-arch: ${{ inputs.platform-arch }}
        build-config: ${{ inputs.build-config }}

    # R-06 verification: the Win32 exe must carry a Safe Exception Handler
    # table. No-op on x64 (/SAFESEH is x86-only). Same step as release.yml;
    # the Debug|Win32 build used to have no such check.
    - uses: ./.github/actions/verify-safeseh
      with:
        platform-arch: ${{ inputs.platform-arch }}
        build-config: ${{ inputs.build-config }}

    - uses: ./.github/actions/upload-some-artifacts
      with:
        platform-arch: ${{ inputs.platform-arch }}
        build-config: ${{ inputs.build-config }}
